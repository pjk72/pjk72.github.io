<!DOCTYPE html>
<html>

<head>
    <title>MusicStream - Reindirizzamento...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        window.onload = function () {
            // Estrae i parametri dal link (es. ?id=xyz&title=abc)
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'song';

            // Crea il vero e proprio Deep Link invisibile per l'app
            const appDeepLink = "musicstream://" + type + "?" + params.toString();

            // Lancia l'app in automatico
            window.location.href = appDeepLink;

            // Se l'app non è installata, dopo 2,5 secondi li manda al PlayStore
            setTimeout(function () {
                window.location.href = "https://play.google.com/store/apps/details?id=com.fazio.musicstream";
            }, 2500);
        };
    </script>
</head>

<body style="background: black; color: white; text-align: center; margin-top: 50px; font-family: sans-serif;">
    <h2>Apertura Brano in corso...</h2>
    <p>Se non hai l'App installata, verrai reindirizzato al Play Store.</p>
</body>

</html>
