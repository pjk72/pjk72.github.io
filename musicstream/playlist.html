<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream Redirect</title>
    <!-- Minimal UI context for a silent redirector -->
    <style>
        body {
            background: #0f172a;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .loading {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.8;
        }

        .action-box {
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
            transition: all 0.2s;
        }

        a:hover {
            background: rgba(129, 140, 248, 0.1);
            border-color: #818cf8;
        }

        .btn-playstore {
            background: #10b981;
            color: white;
            border: none;
            margin-top: 20px;
        }

        .btn-playstore:hover {
            background: #059669;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="content" class="loading">Inizializzazione reindirizzamento...</div>

    <script>
        // Cattura il token dall'URL via Query Param (?token=TOKEN) o Path (/playlist/TOKEN)
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token');

        if (!token) {
            const pathParts = window.location.pathname.split('/');
            const lastPart = pathParts[pathParts.length - 1];
            if (lastPart && lastPart !== 'playlist.html' && lastPart !== 'playlist' && lastPart !== '') {
                token = lastPart;
            }
        }

        const infoDiv = document.getElementById('content');
        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.fazio.musicstream";

        if (token) {
            const deepLink = `musicstream://playlist?token=${token}`;

            // 1. Tenta immediato reindirizzamento app
            window.location.href = deepLink;

            // 2. Fallback Intelligence: se l'utente è ancora qui dopo un po', l'app non è installata
            setTimeout(() => {
                infoDiv.classList.remove('loading');
                infoDiv.innerHTML = `
                    <div class="action-box">
                        <p style="margin-bottom: 20px;">L'applicazione non risponde?</p>
                        <a href="${deepLink}">Riprova Apri Playlist</a>
                        <br><br>
                        <p style="font-size: 13px;">Se non hai ancora MusicStream, scaricala qui:</p>
                        <a href="${playStoreUrl}" class="btn-playstore">SCARICA DA PLAY STORE</a>
                    </div>
                `;

                // Opzionale: Reindirizzamento automatico a Play Store dopo ulteriori 3 secondi (se l'utente non fa nulla)
                // Usato spesso per "Underground" redirectors, ma a volte fastidioso. 
                // Lo attiviamo come puro redirect se sono passati 5 secondi totali.
                setTimeout(() => {
                    // Solo se l'utente non ha ancora cliccato nulla (opzionale, semplifichiamo con il redirect)
                    // window.location.href = playStoreUrl; 
                }, 3000);

            }, 3000);
        } else {
            infoDiv.innerHTML = "Errore: Sessione di condivisione non trovata (Token assente).";
            infoDiv.style.color = "#fb7185";
        }
    </script>
</body>

</html>
